<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tic-Tac-Toe Room {{ room_code }}</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }
    .game-wrap {
      width: min(680px, 92vw);
      background: rgba(255,255,255,.08);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 12px 28px rgba(0,0,0,.45);
      border: 1px solid rgba(255,255,255,.12);
    }
    h1 {
      text-align: center;
      margin-top: 0;
      font-size: 2rem;
    }
    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 16px 0 22px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .badge {
      background: rgba(255,255,255,.08);
      border-radius: 999px;
      padding: 10px 14px;
      color: #cbd5e1;
      border: 1px solid rgba(255,255,255,.2);
    }
    #status {
      font-weight: bold;
      color: #9bf6ff;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 95px);
      gap: 10px;
      align-content: center;
      justify-content: center;
      margin: 16px auto 20px;
    }
    .cell {
      width: 95px;
      height: 95px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.4);
      background: linear-gradient(135deg, #243c58, #3a6079);
      color: #fff;
      font-size: 2rem;
      font-weight: bold;
      cursor: pointer;
    }
    .cell:disabled {
      opacity: 0.95;
      cursor: default;
    }
    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .actions a {
      color: #071127;
      text-decoration: none;
      background: #e2e8f0;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="game-wrap">
    <h1>Tic-Tac-Toe</h1>
    <div class="meta">
      <div class="badge">Room: <span id="roomCode">{{ room_code }}</span></div>
      <div class="badge">You: <span id="playerName">{{ username }}</span></div>
      <div class="badge" id="status">Waiting for move</div>
    </div>

    <div class="board">
      {% for i in '123456789' %}
        <button class="cell" data-index="{{ forloop.counter0 }}">-</button>
      {% endfor %}
    </div>

    <div class="actions">
      <a href="/">Back to lobby</a>
    </div>
  </div>

  <script>
    const roomCode = '{{ room_code|escapejs }}';
    const username = '{{ username|escapejs }}';
    const gameCreator = '{{ game_creator|escapejs }}';
    const gameOpponent = '{{ game_opponent|escapejs }}';
    const initialBoard = '{{ board }}';
    const cells = Array.from(document.querySelectorAll('.cell'));
    const status = document.getElementById('status');

    function renderBoard(board) {
      for (let i = 0; i < cells.length; i++) {
        cells[i].textContent = board[i] === '-' ? '' : board[i];
      }
    }

    renderBoard(initialBoard);

    const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
    const socket = new WebSocket(protocol + '://' + window.location.host + '/ws/game/' + roomCode + '/');

    socket.onmessage = function(event) {
      const message = JSON.parse(event.data);
      if (message.event === 'game_state') {
        renderBoard(message.board);
        if (message.is_over) {
          if (message.winner === 'draw') {
            status.textContent = 'Draw game';
          } else {
            status.textContent = 'Winner: ' + message.winner;
          }
        } else {
          status.textContent = 'Turn: ' + message.current_turn;
        }
      }
    };

    cells.forEach(function(cell) {
      cell.addEventListener('click', function() {
        const index = Number(cell.dataset.index);
        const row = Math.floor(index / 3);
        const col = index % 3;
        if (socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({
            action: 'move',
            username: username,
            room_code: roomCode,
            row: row,
            col: col,
          }));
        }
      });
    });
  </script>
</body>
</html>
